<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>VIỆT NAM 5D</title>
<style>
body{margin:0;background:#0a0a1a;color:white;font-family:Arial;overflow:hidden}
#map{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:380px;height:650px;background:linear-gradient(gold,yellow);clip-path:path("M150 0 C200 0 250 50 250 150 C250 250 200 300 180 400 C160 500 150 650 100 650 C50 650 0 500 20 400 C40 300 100 250 100 150 C100 50 100 0 150 0 Z");box-shadow:0 0 40px gold;display:flex;align-items:center;justify-content:center;font-size:30px;color:red;font-weight:bold}
.portal{position:absolute;width:110px;height:110px;border-radius:50%;border:3px solid gold;background:rgba(255,215,0,0.2);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;cursor:pointer;animation:float 3s infinite}
.portal:hover{transform:scale(1.2);background:gold;color:black}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.char{position:absolute;font-size:50px;animation:float 2s infinite}
#info{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);padding:10px 20px;border-radius:20px;border:2px solid gold}
</style>
</head>
<body>
<div id="map">VIỆT NAM<br>🇻🇳</div>
<div class="portal" style="left:10%;top:10%">Hà Nội<br>Xích Lô</div>
<div class="portal" style="left:20%;top:5%">Hạ Long<br>Thuyền Rồng</div>
<div class="portal" style="left:5%;top:40%">Sapa<br>Cáp Treo</div>
<div class="portal" style="left:15%;top:60%">Ninh Bình<br>Đò Nan</div>
<div class="portal" style="left:5%;top:80%">Huế<br>Thuyền Rồng</div>
<div class="portal" style="left:35%;top:85%">Hội An<br>Thuyền Thúng</div>
<div class="portal" style="left:60%;top:85%">Đà Nẵng<br>Cáp Treo</div>
<div class="portal" style="left:80%;top:70%">Miền Tây<br>Xuồng Ba Lá</div>
<div class="portal" style="left:85%;top:40%">Nha Trang<br>Cano</div>
<div class="portal" style="left:80%;top:10%">Hà Giang<br>Xe Máy</div>
<div class="char" style="left:48%;top:45%">👦</div>
<div class="char" style="left:52%;top:48%;animation-delay:0.5s">👧</div>
<div id="info">🛶 Đang đi: Xuồng Ba Lá Miền Tây quanh rặng dừa - Click cổng để bay!</div>
<script>
document.querySelectorAll('.portal').forEach(p=>{
 p.onclick=()=>{document.getElementById('info').innerHTML='✈️ Đang bay tới '+p.innerText+'... 5D'; setTimeout(()=>{document.getElementById('info').innerHTML='✅ Đã tới '+p.innerText+'! 🛶';},1000)}
})
</script>
</body>
</html>
